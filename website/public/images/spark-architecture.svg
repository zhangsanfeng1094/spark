<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-label="Spark Bifrost Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bifrostGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f472b6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="860" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="160" fill="#38bdf8" opacity="0.06"/>
  <circle cx="1220" cy="720" r="200" fill="#6366f1" opacity="0.08"/>
  <circle cx="700" cy="500" r="280" fill="#a855f7" opacity="0.04"/>

  <!-- Title -->
  <text x="70" y="58" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">Spark 统一架构总览</text>
  <text x="70" y="88" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="15">Shared Daemon · Ingress 协议网关 · Bifrost 核心驱动引擎 · 多 Agent 调度中枢</text>

  <!-- Section 1: Developer & Control Plane -->
  <g filter="url(#shadow)">
    <rect x="70" y="130" width="220" height="150" rx="20" fill="url(#card)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="180" y="165" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">开发者控制面板</text>
  <rect x="90" y="180" width="180" height="34" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="180" y="202" text-anchor="middle" fill="#38bdf8" font-family="DejaVu Sans, sans-serif" font-size="13">Spark TUI / CLI</text>
  <rect x="90" y="225" width="180" height="34" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="180" y="247" text-anchor="middle" fill="#a78bfa" font-family="DejaVu Sans, sans-serif" font-size="13">Spark Web UI (:8765)</text>

  <!-- Section 2: Coding Agents (Ingress Clients) -->
  <text x="180" y="340" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">多 Agent 接入层</text>

  <!-- Codex Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="360" width="220" height="75" rx="14" fill="url(#card)" stroke="#22d3ee" stroke-width="1.5"/>
  </g>
  <text x="180" y="392" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Codex CLI</text>
  <text x="180" y="416" text-anchor="middle" fill="#67e8f9" font-family="DejaVu Sans, sans-serif" font-size="12">POST /v1/responses (SSE)</text>

  <!-- Claude Code Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="450" width="220" height="75" rx="14" fill="url(#card)" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <text x="180" y="482" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Claude Code</text>
  <text x="180" y="506" text-anchor="middle" fill="#fde68a" font-family="DejaVu Sans, sans-serif" font-size="12">POST /v1/messages (Thinking)</text>

  <!-- Grok Build Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="540" width="220" height="65" rx="14" fill="url(#card)" stroke="#818cf8" stroke-width="1.5"/>
  </g>
  <text x="180" y="570" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Grok Build</text>
  <text x="180" y="590" text-anchor="middle" fill="#a5b4fc" font-family="DejaVu Sans, sans-serif" font-size="11">GROK_HOME 临时沙盒隔离</text>

  <!-- One & OpenCode Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="620" width="220" height="65" rx="14" fill="url(#card)" stroke="#818cf8" stroke-width="1.5"/>
  </g>
  <text x="180" y="650" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">One / OpenCode</text>
  <text x="180" y="670" text-anchor="middle" fill="#a5b4fc" font-family="DejaVu Sans, sans-serif" font-size="11">4 Wire 协议直连 / 零开销</text>

  <!-- Connectors from Clients to Daemon -->
  <line x1="290" y1="397" x2="380" y2="397" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="487" x2="380" y2="487" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="572" x2="380" y2="572" stroke="#818cf8" stroke-width="1.6" opacity="0.6"/>
  <line x1="290" y1="652" x2="380" y2="652" stroke="#818cf8" stroke-width="1.6" opacity="0.6"/>

  <!-- Section 3: Spark Shared Daemon & Bifrost Engine Core -->
  <g filter="url(#shadow)">
    <rect x="390" y="130" width="560" height="630" rx="24" fill="url(#card)" stroke="url(#spark)" stroke-width="2"/>
  </g>

  <!-- Daemon Header -->
  <rect x="390" y="130" width="560" height="54" rx="24" fill="url(#spark)" opacity="0.95"/>
  <rect x="390" y="160" width="560" height="24" fill="url(#spark)"/>
  <text x="670" y="165" text-anchor="middle" fill="#0b1220" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700">Spark Shared Daemon (Port: 42337)</text>

  <!-- Ingress Gateway Sub-Box -->
  <rect x="420" y="210" width="500" height="110" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="670" y="236" text-anchor="middle" fill="#38bdf8" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">高保真 Ingress 适配层 (HTTP / SSE Router)</text>
  <rect x="440" y="255" width="220" height="45" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="550" y="278" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600">Codex Ingress</text>
  <text x="550" y="294" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="10">/v1/responses ⇄ Chat/Completions</text>

  <rect x="680" y="255" width="220" height="45" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="790" y="278" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600">Claude Ingress</text>
  <text x="790" y="294" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="10">/v1/messages ⇄ Tool/Thinking</text>

  <!-- Dynamic Profile Resolver Sub-Box -->
  <rect x="420" y="340" width="500" height="85" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="670" y="366" text-anchor="middle" fill="#a5b4fc" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">多维动态 Profile 解析器 (Dynamic Resolver)</text>
  <text x="670" y="392" text-anchor="middle" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">Header 指定 ➔ API Key 匹配 ➔ 请求 Model 智能兜底 ➔ Default Profile</text>
  <text x="670" y="412" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="11">实现多终端不同 Profile 共享单 Daemon 实例</text>

  <!-- Bifrost Core Driver Engine Box -->
  <g filter="url(#shadow)">
    <rect x="420" y="445" width="500" height="175" rx="18" fill="#0f172a" stroke="url(#bifrostGrad)" stroke-width="2"/>
  </g>
  <rect x="420" y="445" width="500" height="38" rx="18" fill="url(#bifrostGrad)" opacity="0.9"/>
  <rect x="420" y="465" width="500" height="18" fill="url(#bifrostGrad)"/>
  <text x="670" y="470" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Bifrost Core 统一驱动引擎 (bifrost/core)</text>

  <rect x="440" y="505" width="220" height="42" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="550" y="526" text-anchor="middle" fill="#f472b6" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600">SparkLLMPlugin 拦截器</text>
  <text x="550" y="540" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="10">&lt;think&gt; 思考提取 / 字段清洗</text>

  <rect x="680" y="505" width="220" height="42" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="790" y="526" text-anchor="middle" fill="#c084fc" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600">Unified Upstream Pool</text>
  <text x="790" y="540" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="10">连接复用 · 低时延流式转发</text>

  <rect x="440" y="560" width="460" height="42" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="670" y="582" text-anchor="middle" fill="#38bdf8" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600">多协议 Provider 适配器</text>
  <text x="670" y="596" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="10">OpenAI / Anthropic / Gemini / DeepSeek / Ollama / Custom</text>

  <!-- Local SQLite & Usage Box -->
  <rect x="420" y="640" width="500" height="95" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="670" y="668" text-anchor="middle" fill="#34d399" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">本地存储与运维统计</text>
  <text x="670" y="694" text-anchor="middle" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="12">SQLite Token 用量审计 (usage.db) · MCP Server 编排 · Skills 投影</text>
  <text x="670" y="718" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="11">守护进程生命周期管理: spark daemon start / status / stop</text>

  <!-- Connectors from Bifrost to Upstream Providers -->
  <line x1="920" y1="535" x2="1030" y2="245" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <line x1="920" y1="545" x2="1030" y2="345" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <line x1="920" y1="555" x2="1030" y2="445" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <line x1="920" y1="565" x2="1030" y2="545" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <line x1="920" y1="575" x2="1030" y2="645" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Section 4: Upstream LLM Providers -->
  <text x="1160" y="160" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">多元上游大模型 API</text>

  <!-- OpenAI -->
  <g filter="url(#shadow)">
    <rect x="1040" y="210" width="240" height="70" rx="14" fill="url(#card)" stroke="#34d399" stroke-width="1.4"/>
  </g>
  <text x="1160" y="242" text-anchor="middle" fill="#d1fae5" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600">OpenAI / Azure</text>
  <text x="1160" y="264" text-anchor="middle" fill="#6ee7b7" font-family="DejaVu Sans, sans-serif" font-size="12">GPT-5 / GPT-4o / Codex</text>

  <!-- Anthropic -->
  <g filter="url(#shadow)">
    <rect x="1040" y="310" width="240" height="70" rx="14" fill="url(#card)" stroke="#34d399" stroke-width="1.4"/>
  </g>
  <text x="1160" y="342" text-anchor="middle" fill="#d1fae5" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600">Anthropic Claude</text>
  <text x="1160" y="364" text-anchor="middle" fill="#6ee7b7" font-family="DejaVu Sans, sans-serif" font-size="12">Claude 3.7 / 3.5 Sonnet</text>

  <!-- Google Gemini -->
  <g filter="url(#shadow)">
    <rect x="1040" y="410" width="240" height="70" rx="14" fill="url(#card)" stroke="#34d399" stroke-width="1.4"/>
  </g>
  <text x="1160" y="442" text-anchor="middle" fill="#d1fae5" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600">Google Gemini</text>
  <text x="1160" y="464" text-anchor="middle" fill="#6ee7b7" font-family="DejaVu Sans, sans-serif" font-size="12">Gemini 2.5 Pro / Flash</text>

  <!-- DeepSeek / AMD / OpenSource -->
  <g filter="url(#shadow)">
    <rect x="1040" y="510" width="240" height="70" rx="14" fill="url(#card)" stroke="#34d399" stroke-width="1.4"/>
  </g>
  <text x="1160" y="542" text-anchor="middle" fill="#d1fae5" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600">DeepSeek / AMD / Qwen</text>
  <text x="1160" y="564" text-anchor="middle" fill="#6ee7b7" font-family="DejaVu Sans, sans-serif" font-size="12">DeepSeek-V4-Flash / V3 / R1</text>

  <!-- Custom OpenAI-compatible / Ollama -->
  <g filter="url(#shadow)">
    <rect x="1040" y="610" width="240" height="70" rx="14" fill="url(#card)" stroke="#34d399" stroke-width="1.4"/>
  </g>
  <text x="1160" y="642" text-anchor="middle" fill="#d1fae5" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600">Ollama / 自建网关</text>
  <text x="1160" y="664" text-anchor="middle" fill="#6ee7b7" font-family="DejaVu Sans, sans-serif" font-size="12">Anyrouter / One-API / Local</text>

  <!-- Bottom Legend -->
  <rect x="70" y="800" width="18" height="18" rx="4" fill="#22d3ee"/>
  <text x="98" y="814" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="13">Codex 客户端</text>

  <rect x="230" y="800" width="18" height="18" rx="4" fill="#fbbf24"/>
  <text x="258" y="814" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="13">Claude Code 客户端</text>

  <rect x="440" y="800" width="18" height="18" rx="4" fill="#ec4899"/>
  <text x="468" y="814" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="13">Bifrost 统一驱动核心</text>

  <rect x="680" y="800" width="18" height="18" rx="4" fill="#818cf8"/>
  <text x="708" y="814" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="13">共享 Daemon 进程</text>

  <rect x="880" y="800" width="18" height="18" rx="4" fill="#34d399"/>
  <text x="908" y="814" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="13">上游大模型 API</text>

  <text x="1330" y="814" text-anchor="end" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="12">Spark · Unified Bifrost Architecture</text>
</svg>
