<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-label="Spark architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="1400" height="860" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="160" fill="#38bdf8" opacity="0.06"/>
  <circle cx="1220" cy="720" r="200" fill="#6366f1" opacity="0.08"/>

  <!-- Title -->
  <text x="70" y="58" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">Spark 架构总览</text>
  <text x="70" y="88" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="15">AI Coding Agent 启动器 · 配置中心 · 兼容代理</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="70" y="150" width="160" height="90" rx="18" fill="url(#card)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="150" y="188" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">开发者</text>
  <text x="150" y="214" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="13">终端用户</text>

  <!-- Arrow user -> spark -->
  <line x1="230" y1="195" x2="330" y2="195" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Spark core -->
  <g filter="url(#shadow)">
    <rect x="340" y="120" width="420" height="250" rx="24" fill="url(#card)" stroke="url(#spark)" stroke-width="2"/>
  </g>
  <rect x="340" y="120" width="420" height="56" rx="24" fill="url(#spark)" opacity="0.95"/>
  <rect x="340" y="152" width="420" height="24" fill="url(#spark)"/>
  <text x="550" y="156" text-anchor="middle" fill="#0b1220" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">Spark</text>
  <text x="550" y="210" text-anchor="middle" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="14">TUI 主面板  ·  CLI 命令</text>

  <!-- Spark internal modules -->
  <rect x="370" y="235" width="110" height="48" rx="12" fill="#0f172a" stroke="#475569"/>
  <text x="425" y="264" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Profiles</text>

  <rect x="495" y="235" width="110" height="48" rx="12" fill="#0f172a" stroke="#475569"/>
  <text x="550" y="264" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">MCP</text>

  <rect x="620" y="235" width="110" height="48" rx="12" fill="#0f172a" stroke="#475569"/>
  <text x="675" y="264" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Usage</text>

  <rect x="430" y="300" width="240" height="42" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="550" y="326" text-anchor="middle" fill="#7dd3fc" font-family="DejaVu Sans, sans-serif" font-size="13">写入配置 · 启动 Agent</text>

  <!-- Clients section label -->
  <text x="550" y="430" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">正式支持的客户端</text>

  <!-- Lines spark -> clients -->
  <line x1="425" y1="370" x2="250" y2="470" stroke="#67e8f9" stroke-width="1.8" opacity="0.8"/>
  <line x1="500" y1="370" x2="450" y2="470" stroke="#67e8f9" stroke-width="1.8" opacity="0.8"/>
  <line x1="600" y1="370" x2="650" y2="470" stroke="#67e8f9" stroke-width="1.8" opacity="0.8"/>
  <line x1="675" y1="370" x2="850" y2="470" stroke="#67e8f9" stroke-width="1.8" opacity="0.8"/>

  <!-- Client cards -->
  <g filter="url(#shadow)">
    <rect x="160" y="475" width="180" height="100" rx="16" fill="url(#card)" stroke="#22d3ee" stroke-width="1.5"/>
  </g>
  <text x="250" y="518" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">codex</text>
  <text x="250" y="544" text-anchor="middle" fill="#67e8f9" font-family="DejaVu Sans, sans-serif" font-size="13">Codex · 主要支持</text>

  <g filter="url(#shadow)">
    <rect x="360" y="475" width="180" height="100" rx="16" fill="url(#card)" stroke="#22d3ee" stroke-width="1.5"/>
  </g>
  <text x="450" y="518" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">claude</text>
  <text x="450" y="544" text-anchor="middle" fill="#67e8f9" font-family="DejaVu Sans, sans-serif" font-size="13">Claude Code · 主要</text>

  <g filter="url(#shadow)">
    <rect x="560" y="475" width="180" height="100" rx="16" fill="url(#card)" stroke="#818cf8" stroke-width="1.5"/>
  </g>
  <text x="650" y="518" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">opencode</text>
  <text x="650" y="544" text-anchor="middle" fill="#a5b4fc" font-family="DejaVu Sans, sans-serif" font-size="13">OpenCode</text>

  <g filter="url(#shadow)">
    <rect x="760" y="475" width="180" height="100" rx="16" fill="url(#card)" stroke="#818cf8" stroke-width="1.5"/>
  </g>
  <text x="850" y="518" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">grok</text>
  <text x="850" y="544" text-anchor="middle" fill="#a5b4fc" font-family="DejaVu Sans, sans-serif" font-size="13">Grok Build</text>

  <!-- Compat proxy -->
  <line x1="250" y1="575" x2="250" y2="640" stroke="#67e8f9" stroke-width="1.6" opacity="0.7"/>
  <line x1="450" y1="575" x2="450" y2="640" stroke="#67e8f9" stroke-width="1.6" opacity="0.7"/>
  <line x1="250" y1="640" x2="700" y2="640" stroke="#67e8f9" stroke-width="1.6" opacity="0.7"/>
  <line x1="700" y1="640" x2="700" y2="680" stroke="#67e8f9" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.9"/>

  <g filter="url(#shadow)">
    <rect x="520" y="685" width="360" height="90" rx="18" fill="url(#card)" stroke="#f59e0b" stroke-width="1.8"/>
  </g>
  <text x="700" y="722" text-anchor="middle" fill="#fde68a" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">本地兼容代理 Compat Proxy</text>
  <text x="700" y="750" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="13">协议转换 · 可选路径</text>

  <!-- Upstream APIs on the right -->
  <text x="1160" y="160" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">上游 API</text>

  <g filter="url(#shadow)">
    <rect x="1040" y="190" width="240" height="70" rx="14" fill="url(#card)" stroke="#34d399" stroke-width="1.4"/>
  </g>
  <text x="1160" y="232" text-anchor="middle" fill="#d1fae5" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600">OpenAI 系接口</text>

  <g filter="url(#shadow)">
    <rect x="1040" y="290" width="240" height="70" rx="14" fill="url(#card)" stroke="#34d399" stroke-width="1.4"/>
  </g>
  <text x="1160" y="332" text-anchor="middle" fill="#d1fae5" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600">Anthropic Messages</text>

  <g filter="url(#shadow)">
    <rect x="1040" y="390" width="240" height="70" rx="14" fill="url(#card)" stroke="#34d399" stroke-width="1.4"/>
  </g>
  <text x="1160" y="432" text-anchor="middle" fill="#d1fae5" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600">Gemini generateContent</text>

  <!-- Lines proxy/clients to APIs -->
  <path d="M880 525 C980 525, 980 225, 1040 225" fill="none" stroke="#34d399" stroke-width="1.6" opacity="0.55"/>
  <path d="M880 525 C980 525, 980 325, 1040 325" fill="none" stroke="#34d399" stroke-width="1.6" opacity="0.55"/>
  <path d="M880 730 C980 730, 1000 425, 1040 425" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.75" marker-end="url(#arrow)"/>
  <line x1="880" y1="525" x2="960" y2="525" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>

  <!-- Legend -->
  <rect x="70" y="780" width="18" height="18" rx="4" fill="#22d3ee"/>
  <text x="98" y="794" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="13">主要支持</text>
  <rect x="200" y="780" width="18" height="18" rx="4" fill="#818cf8"/>
  <text x="228" y="794" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="13">已支持</text>
  <rect x="310" y="780" width="18" height="18" rx="4" fill="#f59e0b"/>
  <text x="338" y="794" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="13">协议转换</text>
  <rect x="440" y="780" width="18" height="18" rx="4" fill="#34d399"/>
  <text x="468" y="794" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="13">上游模型 API</text>

  <text x="1330" y="830" text-anchor="end" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="12">Spark · architecture overview</text>
</svg>
