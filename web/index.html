<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spark - Connecting Intelligent Workflows" />
    <meta name="theme-color" content="#0f172a" />
    <title>Spark</title>
    
    <!-- Modern SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M12 2C12 7.5 16.5 12 22 12C16.5 12 12 16.5 12 22C12 16.5 7.5 12 2 12C7.5 12 12 7.5 12 2Z' fill='url(%23g)'/%3E%3C/svg%3E" />
    
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Preloader and NoScript Styling -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a; /* Slate 900 */
        color: #f1f5f9; /* Slate 100 */
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .preloader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        z-index: 9999;
      }

      .preloader-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo-container {
        position: relative;
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 0 20px rgba(99, 102, 241, 0.15);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }

      .logo-container::after {
        content: '';
        position: absolute;
        inset: -2px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        border-radius: 22px;
        z-index: -1;
        opacity: 0.3;
        animation: pulse-glow 2s infinite ease-in-out;
      }

      .sparkle-logo {
        width: 38px;
        height: 38px;
        animation: logo-spin 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }

      .brand-name {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #ffffff;
        margin: 0;
        background: linear-gradient(to right, #ffffff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .brand-subtitle {
        font-size: 14px;
        color: #94a3b8; /* Slate 400 */
        margin: 8px 0 24px 0;
        font-weight: 400;
      }

      .loader-bar-container {
        width: 140px;
        height: 3px;
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 999px;
        overflow: hidden;
      }

      .loader-bar-progress {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #6366f1, #a855f7);
        border-radius: 999px;
        animation: loader-slide 1.5s infinite ease-in-out;
      }

      @keyframes pulse-glow {
        0%, 100% {
          opacity: 0.2;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.04);
        }
      }

      @keyframes logo-spin {
        0% {
          transform: scale(0.9) rotate(0deg);
        }
        50% {
          transform: scale(1.1) rotate(180deg);
        }
        100% {
          transform: scale(0.9) rotate(360deg);
        }
      }

      @keyframes loader-slide {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(150%);
        }
        100% {
          transform: translateX(300%);
        }
      }
    </style>
  </head>
  <body>
    <!-- React Root Entry Container -->
    <div id="root">
      <!-- Elegant Spark Preloader -->
      <div class="preloader-wrapper">
        <div class="preloader-content">
          <div class="logo-container">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="sparkle-logo">
              <defs>
                <linearGradient id="loader-sparkle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#818cf8" />
                  <stop offset="100%" stop-color="#c084fc" />
                </linearGradient>
              </defs>
              <path d="M12 2C12 7.5 16.5 12 22 12C16.5 12 12 16.5 12 22C12 16.5 7.5 12 2 12C7.5 12 12 7.5 12 2Z" fill="url(#loader-sparkle-gradient)" />
            </svg>
          </div>
          <h1 class="brand-name">Spark</h1>
          <p class="brand-subtitle">Connecting Intelligent Workflows</p>
          <div class="loader-bar-container">
            <div class="loader-bar-progress"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Noscript support block -->
    <noscript>
      <style>
        .noscript-container {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #0f172a;
          color: #ffffff;
          padding: 20px;
          text-align: center;
          z-index: 10000;
        }
        .noscript-card {
          max-width: 400px;
          padding: 32px;
          background: rgba(30, 41, 59, 0.7);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
          backdrop-filter: blur(12px);
        }
        .noscript-title {
          font-size: 20px;
          font-weight: 700;
          margin-bottom: 12px;
          color: #f1f5f9;
        }
        .noscript-desc {
          font-size: 14px;
          color: #94a3b8;
          line-height: 1.6;
        }
      </style>
      <div class="noscript-container">
        <div class="noscript-card">
          <div class="noscript-title">JavaScript Required</div>
          <div class="noscript-desc">To experience Spark and manage your intelligent workflows, please enable JavaScript in your browser settings and refresh the page.</div>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
